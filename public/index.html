<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Control de Proyectos</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head>
  <body>
    <header class="topbar"><a class="brand" href="/"><span>▦</span> Control de Proyectos</a><div class="header-actions"><select id="area-filter" aria-label="Filtrar por área"></select><a class="button ghost" href="/login.html">Iniciar sesión</a></div></header>
    <main class="shell"><section class="banner public"><div><strong>Vista gerencial · solo lectura</strong><p>Consulta el estado de los proyectos por área, sin iniciar sesión.</p></div><span id="live-clock"></span></section><section class="metrics"><article><span>PROYECTOS ACTIVOS</span><strong id="metric-projects">—</strong></article><article><span>AVANCE PROMEDIO</span><strong id="metric-progress">—</strong></article><article><span>CON ALERTAS</span><strong id="metric-alerts">—</strong></article></section><section class="section-title"><div><h1 id="area-title">Proyectos</h1><p id="area-subtitle">Seguimiento operativo</p></div></section><div id="projects" class="project-grid"></div></main>
    <template id="project-template"><article class="project-card"><div class="card-head"><div><span class="status"></span><h2></h2></div><span class="progress-number"></span></div><p class="project-meta"></p><div class="progress"><i></i></div><div class="card-info"></div><div class="steps"></div></article></template>
    <script type="module" src="/public-dashboard.js"></script>
  </body>
</html>
