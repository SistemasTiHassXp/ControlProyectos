<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Ingresar · Control de Proyectos
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="/styles.css">
</head>

<body class="login-page login-cnt">

    <main class="login-cnt-main">

        <div class="cnt-logo"><span>GRUPO</span><strong>CNT</strong></div>

        <form
            id="login-form"
            class="login-panel cnt-login-panel"
            novalidate>

            <p class="login-product">Control de Proyectos</p>

            <h1>
                Iniciar sesión
            </h1>

            <p>
                Ingresa con tu usuario y contraseña.
            </p>

            <div id="session-controls"></div>

            <label>

                <span>♙</span> Usuario

                <input
                    name="username"
                    autocomplete="username"
                    placeholder="Ej. jmateo"
                    required>

            </label>

            <label>

                <span>▣</span> Contraseña

                <input
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    required>

            </label>

            <p
                id="form-error"
                class="error">
            </p>

            <button
                type="submit"
                class="button">

                Ingresar

            </button>

        </form>

        <p class="login-caption">◈ Gestión eficiente. Proyectos exitosos.</p>

    </main>

    <script
        type="module"
        src="/login.js">
    </script>

</body>

</html>
